<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Takrim Auto - Masik Hisab</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{background:#0f1410;color:#fff;padding:6px;font-size:13px}
.header-banner{background:#fff;border-radius:12px;padding:0;margin-bottom:6px;border:2px solid #0a5c36;overflow:hidden}
.header-banner img{width:100%;display:block;max-height:180px;object-fit:contain}
.top-row{display:flex;gap:6px;margin-bottom:6px}.box{flex:1;background:#1e2a22;border-radius:10px;padding:8px;border:1px solid #2e4a35}
.box b{font-size:11px;display:block} .box input{padding:6px;font-size:11px;border-radius:6px;border:0;background:#fff;color:#000;width:100%}
.btn{padding:6px;border-radius:6px;border:0;font-weight:bold;font-size:11px;flex:1;cursor:pointer}.row{display:flex;gap:4px;margin-top:4px}.btn-dark{background:#3a3a3a;color:#fff}.btn-green{background:#7ed957;color:#000}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}.auto{background:#1e2a22;border-radius:10px;overflow:hidden;border:1px solid #2a4a32}.head{padding:8px;display:flex;gap:6px;align-items:center}
.head img{width:28px;height:28px;border-radius:50%;background:#333;object-fit:cover}.head b{font-size:11px}.head small{font-size:9px;opacity:.8}
.body{display:none;padding:16px;background:#233326} .auto.open{grid-column:1/-1} .auto.open .body{display:block}.body input{width:100%;padding:14px;margin:6px 0;border-radius:8px;border:0;background:#111;color:#fff;font-size:15px}
table{width:100%;border-collapse:collapse;font-size:14px;margin-top:10px}th,td{border-bottom:1px solid #333;padding:6px;text-align:left}
.preview{background:#fff;color:#000;border-radius:10px;padding:10px;display:none;position:fixed;top:3%;left:3%;right:3%;max-height:92%;overflow:auto;z-index:99}
#pdfCapture{background:#fff;color:#000;padding:10px;width:800px}#pdfCapture th{background:#0a5c36;color:#fff;padding:6px} #pdfCapture td{padding:5px;border-bottom:1px solid #ccc}
.title-bar{text-align:center;background:#1a3320;border-radius:8px;padding:6px;margin-bottom:6px;border:1px solid #0a5c36}.title-bar h3{font-size:14px;color:#7ed957}
.del-icon { color: #ff4d4d; cursor: pointer; font-weight: bold; text-align: center; width: 30px; }

/* ব্যাকআপ বাটনের নতুন স্টাইল */
.backup-section { margin-top: 10px; padding: 8px; border: 1px dashed #7ed957; border-radius: 10px; background: #162219; display: flex; gap: 8px; }
.btn-backup { padding: 10px; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; flex: 1; font-size: 12px; }
.btn-export { background-color: #0288d1; }
.btn-import { background-color: #e65100; }
</style>
</head>
<body>
<div class="header-banner">
<img src="IMG-20261028-WA0023.jpg" alt="Takrim Auto Limited" onerror="this.src='banner.jpg'">
</div>
<div class="title-bar"><h3>📊 মাসিক আয় ব্যয় হিসাব</h3></div>
<div class="top-row">
<div class="box"><b>PDF-১: দৈনিক হিসাব</b><input type="date" id="oneDate" value="2026-10-05"><div class="row"><button class="btn btn-dark" onclick="previewOne()">👁️</button><button class="btn btn-green" onclick="downloadOne()">⬇️ PDF</button></div></div>
<div class="box"><b>PDF-২: মাসিক ১-৩১</b><input type="month" id="monthDate" value="2026-10"><div class="row"><button class="btn btn-dark" onclick="previewMonth()">👁️ ১-৩১</button><button class="btn btn-green" onclick="downloadMonth()">⬇️ PDF</button></div></div>
</div>
<div id="preview" class="preview"><div style="display:flex;justify-content:space-between"><b id="pTitle"></b><button onclick="document.getElementById('preview').style.display='none'" style="padding:4px 10px">X</button></div><div id="pContent"></div><button class="btn btn-green" style="width:100%;margin-top:8px;padding:14px;font-size:15px" onclick="downloadCurrent()">📄 ডাউনলোড</button></div>
<div class="grid" id="list"></div>
<div style="position:absolute;left:-9999px;top:0"><div id="pdfCapture"></div></div>
<div style="margin-top:8px;padding:8px;border:1px solid #0a5c36;border-radius:10px;background:#111a12">
<div style="display:flex;gap:6px;margin-bottom:6px">
<div style="flex:1;background:#fff;border:2px solid #16a34a;border-radius:10px;padding:8px;text-align:center"><small style="font-size:8px;color:#475569;display:block">মাসের আয়</small><b id="totalIncome" style="font-size:13px;color:#14532d">৳0</b></div>
<div style="flex:1;background:#fff;border:2px solid #16a34a;border-radius:10px;padding:8px;text-align:center"><small style="font-size:8px;color:#475569;display:block">মাসের খরচ</small><b id="totalExpense" style="font-size:13px;color:#b91c1c">৳0</b></div>
<div style="flex:1;background:#fff;border:2px solid #16a34a;border-radius:10px;padding:8px;text-align:center"><small style="font-size:8px;color:#475569;display:block">মাসের লাভ</small><b id="totalProfit" style="font-size:13px;color:#14532d">৳0</b></div>
</div>
<div style="display:flex;gap:6px">
<div onclick="downloadSummaryPDF()" style="flex:1;background:#fff;border:3px solid #16a34a;border-radius:12px;padding:10px;display:flex;align-items:center;gap:8px;cursor:pointer"><div style="font-size:22px">🖨️</div><div><div style="font-size:13px;font-weight:900;color:#14532d">PDF প্রিন্ট</div></div></div>
<div style="flex:1;background:#fff;border:2px solid #16a34a;border-radius:12px;padding:10px;text-align:center"><small style="font-size:9px;color:#475569;display:block">💰 মোট লাভ</small><b id="lifetimeProfit" style="font-size:16px;color:#14532d">৳0</b></div>
</div>
</div>

<!-- নতুন যুক্ত হওয়া সেফটি ব্যাকআপ সেকশন -->
<div class="backup-section">
    <button class="btn-backup btn-export" onclick="exportData()">📥 ডেটা ব্যাকআপ (ডাউনলোড)</button>
    <button class="btn-backup btn-import" onclick="document.getElementById('importFile').click()">📤 ডেটা রিস্টোর (আপলোড)</button>
    <input type="file" id="importFile" accept=".json" onchange="importData(event)" style="display: none;">
</div>

<script>
// ১ থেকে ১০ পর্যন্ত ফ্রেশ বাংলা সিরিয়াল এবং নাম সেট করা হলো
let autos=["অটো-০১","অটো-০২","অটো-০৩","অটো-০৪","অটো-০৫","অটো-০৬","অটো-০৭","অটো-০৮","অটো-০৯","অটো-১০"];
let names=["রাকিব","আলম","সজিব","নাসির","করিম","সুমন","রিপন","আনোয়ার","জামাল","রফিক"];
let drivers=JSON.parse(localStorage.getItem('dFinal')||'null')||autos.map((a,i)=>({name:names[i],phone:"",photo:""}));
let tx=JSON.parse(localStorage.getItem('tFinal')||'{}');let lastType='';

function save(){localStorage.setItem('dFinal',JSON.stringify(drivers));localStorage.setItem('tFinal',JSON.stringify(tx));updateSummary();}

function render(){
    let h='';
    autos.forEach((auto,i)=>{
        let d=drivers[i];
        let list=tx[auto]||[];
        let total=list.reduce((s,x)=>s+x.income,0);
        
        let tableRows = list.slice(-5).reverse().map((r) => {
            let actualIndex = list.indexOf(r); 
            return `<tr>
                <td>${r.date.slice(5)}</td>
                <td>${r.income}৳</td>
                <td>${r.expense}৳</td>
                <td class="del-icon" onclick="deleteSingleRow('${auto}', ${actualIndex})">❌</td>
            </tr>`;
        }).join('');

        h+=`<div class="auto" id="a${i}"><div class="head" onclick="document.getElementById('a${i}').classList.toggle('open')"><img src="${d.photo||'https://via.placeholder.com/100'}"><div style="flex:1"><b>${auto} ${d.name}</b><br><small>${d.phone||'নাই'} | ${list.length} দিন | ${total}৳</small></div>▼</div><div class="body"><input id="n${i}" value="${d.name}" placeholder="নাম"><input id="p${i}" value="${d.phone}" placeholder="ফোন"><input type="file" accept="image/*" onchange="photo(${i},this)"><button class="btn btn-dark" style="width:100%;padding:12px" onclick="saveD(${i})">💾 সেভ</button><input type="date" id="dt${i}" value="${document.getElementById('oneDate').value}"><div class="row"><input type="number" id="in${i}" placeholder="আয়"><input type="number" id="ex${i}" placeholder="খরচ"></div><button class="btn btn-green" style="width:100%;padding:15px;font-size:16px" onclick="addT(${i})">➕ জমা যোগ</button><table><tr><th>তারিখ</th><th>আয়</th><th>খরচ</th><th>মুছুন</th></tr>${tableRows}</table></div></div>`;
    });
    document.getElementById('list').innerHTML=h;
}

function photo(i,el){
    let f=el.files[0];if(!f)return;
    let r=new FileReader();r.onload=function(e){drivers[i].photo=e.target.result;save();render();};r.readAsDataURL(f);
}

function saveD(i){
    drivers[i].name=document.getElementById('n'+i).value;
    drivers[i].phone=document.getElementById('p'+i).value;
    save();render();alert('ড্রাইভার তথ্য সফলভাবে সেভ হয়েছে!');
}

function addT(i){
    let auto=autos[i];let d=document.getElementById('dt'+i).value;
    let inc=parseInt(document.getElementById('in'+i).value)||0;
    let exp=parseInt(document.getElementById('ex'+i).value)||0;
    if(!tx[auto])tx[auto]=[];
    tx[auto].push({date:d,income:inc,expense:exp});
    document.getElementById('in'+i).value='';
    document.getElementById('ex'+i).value='';
    save();render();
}

function deleteSingleRow(auto,idx){
    if(confirm('আপনি কি নিশ্চিত যে এই হিসাবটি মুছে ফেলতে চান?')){
        tx[auto].splice(idx,1);save();render();
    }
}

function updateSummary(){
    let ti=0,te=0;
    autos.forEach(auto=>{
        let list=tx[auto]||[];
        list.forEach(x=>{ti+=x.income;te+=x.expense;});
    });
    document.getElementById('totalIncome').innerText='৳'+ti;
    document.getElementById('totalExpense').innerText='৳'+te;
    document.getElementById('totalProfit').innerText='৳'+(ti-te);
    document.getElementById('lifetimeProfit').innerText='৳'+(ti-te);
}

function exportData(){
    let data={drivers:drivers,tx:tx};
    let s=JSON.stringify(data);let b=new Blob([s],{type:"application/json"});
    let a=document.createElement('a');a.href=URL.createObjectURL(b);
