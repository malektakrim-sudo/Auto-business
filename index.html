<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>অটো ম্যানেজ - ১০ অটো</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:sans-serif;background:#0f1a12;color:#fff;padding-bottom:80px}
.header{background:#1a3320;padding:18px 16px;display:flex;justify-content:space-between}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;padding:16px}
.card{border-radius:16px;padding:14px;text-align:center}
.c1,.c3{background:#2a5a36} .c2{background:#6b3d1f}
.card h2{margin-top:6px}
.auto-item{background:#1e2a22;margin:0 12px 10px 12px;border-radius:14px;padding:14px;display:flex;justify-content:space-between}
.badge{background:#7ed957;color:#000;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:bold}
.money{color:#7ed957;text-align:right;font-size:13px}
input,select,button{width:100%;padding:12px;margin:6px 0;border-radius:10px;border:none}
button{background:#7ed957;color:#000;font-weight:bold;font-size:16px}
.form-box{background:#1e2a22;margin:16px;border-radius:16px;padding:16px}
.nav{position:fixed;bottom:0;left:0;right:0;background:#1a3320;display:flex;justify-content:space-around;padding:10px}
</style>
</head>
<body>
<div class="header"><h1>🛺 অটো ম্যানেজ</h1><span>👤</span></div>

<div class="stats">
<div class="card c1"><p>আজকের আয়</p><h2 id="tIncome">৳ ০</h2><small id="tCount">১০টি</small></div>
<div class="card c2"><p>খরচ</p><h2 id="tExpense">৳ ০</h2><small>তেল+মেরামত</small></div>
<div class="card c3"><p>লাভ</p><h2 id="tProfit">৳ ০</h2></div>
</div>

<h3 style="padding:10px 16px">অটোসমূহ (১০টি)</h3>
<div id="autoList"></div>

<div class="form-box">
<h3>নতুন জমা যোগ করুন</h3>
<select id="autoSelect"></select>
<input type="number" id="income" placeholder="আয় - যেমন 1200">
<input type="number" id="expense" placeholder="খরচ - যেমন 200">
<input type="text" id="note" placeholder="নোট - তেল / মেরামত">
<button onclick="addEntry()">জমা সেভ করুন</button>
</div>

<div class="nav"><div>🏠 ড্যাশবোর্ড</div><div>🛺 অটো</div><div>💰 আয়-ব্যয়</div><div>👤 প্রোফাইল</div></div>

<script>
let autos=["অটো-০১","অটো-০২","অটো-০৩","অটো-০৪","অটো-০৫","অটো-০৬","অটো-০৭","অটো-০৮","অটো-০৯","অটো-১০"];
let drivers=["রাকিব হোসেন","মো. আলম","সজিব মিয়া","নাসির উদ্দিন","করিম শেখ","সুমন আহমেদ","রিপন ভূঁইয়া","আনোয়ার হাসেন","জামাল হোসেন","রফিকুল ইসলাম"];
let data=JSON.parse(localStorage.getItem('autoData')||'{}');
let today=new Date().toISOString().slice(0,10);
function render(){
let list=document.getElementById('autoList');list.innerHTML='';
let sel=document.getElementById('autoSelect');sel.innerHTML='';
let tI=0,tE=0;
autos.forEach((a,i)=>{
sel.innerHTML+=`<option value="${a}">${a} - ${drivers[i]}</option>`;
let d=data[today]?.[a]||{income:0,expense:0,note:''};
tI+=d.income;tE+=d.expense;
list.innerHTML+=`<div class="auto-item"><div><span class="badge">${a}</span> <b>${drivers[i]}</b><br><small>${d.income>0?'✅ জমা দিয়েছে':'⏳ বাকি'} - ${d.note||'মিরপুর'}</small></div><div class="money">আয় ৳${d.income}<br>লাভ ৳${d.income-d.expense}</div></div>`;
});
document.getElementById('tIncome').innerText='৳ '+tI;
document.getElementById('tExpense').innerText='৳ '+tE;
document.getElementById('tProfit').innerText='৳ '+(tI-tE);
}
function addEntry(){
let a=document.getElementById('autoSelect').value;
let inc=parseInt(document.getElementById('income').value||0);
let exp=parseInt(document.getElementById('expense').value||0);
let note=document.getElementById('note').value;
if(!data[today]) data[today]={};
data[today][a]={income:inc,expense:exp,note:note};
localStorage.setItem('autoData',JSON.stringify(data));
render();
document.getElementById('income').value='';document.getElementById('expense').value='';document.getElementById('note').value='';
alert(a+' সেভ হয়েছে!');
}
render();
</script>
</body>
</html>
