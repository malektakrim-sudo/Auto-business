<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>তাকরিম অটো</title>
<style>
*{box-sizing:border-box;font-family:sans-serif}
body{margin:0;background:#f8fafc;padding:6px}
.head{background:#16a34a;color:#fff;text-align:center;padding:8px;border-radius:8px;font-weight:800}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:6px 0}
.auto{border:1.5px solid #16a34a;border-radius:8px;padding:6px;background:#fff;text-align:center;font-size:12px}
.row{display:flex;gap:6px;margin-bottom:6px}
.box{flex:1;border:1.8px solid #16a34a;border-radius:8px;padding:6px;text-align:center;background:#fff}
.box b{display:block;font-size:13px;color:#14532d}
.box span{font-size:10px;color:#475569}
.box2{flex:1;border:2.5px solid #16a34a;border-radius:10px;padding:8px;display:flex;align-items:center;justify-content:center;gap:6px;background:#f0fdf4}
.total{border:2px solid #14532d;border-radius:8px;padding:6px 10px;display:flex;justify-content:space-between;align-items:center;background:#fff;margin-top:6px}
.total span{font-size:12px;font-weight:700} .total b{font-size:13px}
button{width:100%;padding:8px;background:#16a34a;color:#fff;border:0;border-radius:8px;font-weight:800}
</style>
</head>
<body>
<div class="head">🛺 তাকরিম অটো - মাসিক হিসাব</div>
<div class="grid" id="autos"></div>

<div class="row" id="monthRow">
  <div class="box"><span>মাসের আয়</span><b id="moI">৳ 0</b></div>
  <div class="box"><span>মাসের খরচ</span><b id="moE">৳ 0</b></div>
  <div class="box"><span>মাসের লাভ</span><b id="moP">৳ 0</b></div>
</div>

<div class="total"><span>মোট লাভ</span><b id="tot">৳ 0</b></div>
<button onclick="printPDF()" style="margin-top:6px">📄 PDF প্রিন্ট</button>

<div id="pdfArea" style="display:none"></div>
<script>
let autos=Array(10).fill(0).map((_,i)=>({id:i+1,income:4500,expense:1200}));
let monthIncome=0,monthExpense=0,totalIncome=0,totalExpense=0;
function render(){
 let h=''; monthIncome=0;monthExpense=0;
 autos.forEach(a=>{monthIncome+=a.income;monthExpense+=a.expense;
 h+=`<div class="auto">অটো ${a.id}<br>৳ ${a.income}<br><small>খরচ ৳${a.expense}</small></div>`;
 });
 document.getElementById('autos').innerHTML=h;
 document.getElementById('moI').innerText='৳ '+monthIncome.toLocaleString('bn-BD');
 document.getElementById('moE').innerText='৳ '+monthExpense.toLocaleString('bn-BD');
 document.getElementById('moP').innerText='৳ '+(monthIncome-monthExpense).toLocaleString('bn-BD');
 totalIncome=monthIncome*6; totalExpense=monthExpense*6;
 document.getElementById('tot').innerText='৳ '+(totalIncome-totalExpense).toLocaleString('bn-BD');
}
function makeSummaryTable(){
 const moI=monthIncome,moE=monthExpense,moP=moI-moE;
 const allI=totalIncome; const fmt=n=>'৳ '+(n||0).toLocaleString('bn-BD');
 return `<div>
 <div style="text-align:center;margin-bottom:8px"><h2 style="margin:0;font-size:17px;color:#14532d">সারসংক্ষেপ - ${new Date().toLocaleDateString('bn-BD',{month:'long',year:'numeric'})}</h2></div>
 <div style="display:flex;gap:6px;margin-bottom:6px">
  <div style="flex:1;border:1.8px solid #16a34a;border-radius:8px;padding:7px 3px;text-align:center"><div style="font-size:10px;color:#475569">মাসের আয়</div><div style="font-size:13px;font-weight:800;color:#14532d">${fmt(moI)}</div></div>
  <div style="flex:1;border:1.8px solid #16a34a;border-radius:8px;padding:7px 3px;text-align:center"><div style="font-size:10px;color:#475569">মাসের খরচ</div><div style="font-size:13px;font-weight:800;color:#b91c1c">${fmt(moE)}</div></div>
  <div style="flex:1;border:1.8px solid #16a34a;border-radius:8px;padding:7px 3px;text-align:center"><div style="font-size:10px;color:#475569">মাসের লাভ</div><div style="font-size:13px;font-weight:800;color:#14532d">${fmt(moP)}</div></div>
 </div>
 <div style="display:flex;gap:6px">
  <div style="flex:1;border:2.5px solid #16a34a;border-radius:10px;padding:8px;display:flex;align-items:center;justify-content:center;gap:6px;background:#f0fdf4"><span>🖨️</span><div><div style="font-size:12px;font-weight:800;color:#14532d">PDF প্রিন্ট</div><div style="font-size:8px;color:#64748b">রিপোর্ট ডাউনলোড</div></div></div>
  <div style="flex:1;border:1.8px solid #16a34a;border-radius:10px;padding:8px;text-align:center"><div style="font-size:10px;color:#475569">মোট আয়</div><div style="font-size:14px;font-weight:900;color:#14532d">${fmt(allI)}</div></div>
 </div></div>`;
}
function printPDF(){
 const w=window.open('','','width=800,height=600');
 w.document.write('<html><body style="padding:10px">'+makeSummaryTable()+'<hr>'+document.getElementById('autos').innerHTML+'</body></html>');
 w.document.close(); w.print();
}
render();
</script>
</body>
</html>
